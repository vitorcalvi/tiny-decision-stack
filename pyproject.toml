[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "tiny-decision-stack"
version = "0.1.1"
description = "Experimental tiny local decision stack using LFM2.5-350M and OpenDecider-nano"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Vitor Calvi"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Repository = "https://github.com/vitorcalvi/tiny-decision-stack"
Issues = "https://github.com/vitorcalvi/tiny-decision-stack/issues"

[project.optional-dependencies]
local = [
  "accelerate>=1,<2",
  "torch>=2.4,<3",
  "transformers>=5.0,<6",
  "opendecider>=0.7.0,<1",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tiny_decision_stack"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
