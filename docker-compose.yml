services:
  tiny-decision-stack:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8080:8080"
    environment:
      LFM_MODEL: ${LFM_MODEL:-LiquidAI/LFM2.5-350M}
      OPENDECIDER_MODEL: ${OPENDECIDER_MODEL:-manjunathshiva/opendecider-nano}
      MODEL_DEVICE: ${MODEL_DEVICE:-}
      DIRECT_MAX_CHARS: ${DIRECT_MAX_CHARS:-500}
      DEFAULT_CONFIDENCE_THRESHOLD: ${DEFAULT_CONFIDENCE_THRESHOLD:-0.75}
      MAX_STATE_CHARS: ${MAX_STATE_CHARS:-20000}
      MAX_OPTIONS: ${MAX_OPTIONS:-32}
      MAX_CONCURRENT_INFERENCE: ${MAX_CONCURRENT_INFERENCE:-1}
      INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-120}
      HF_HOME: /home/app/.cache/huggingface
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  huggingface-cache:
