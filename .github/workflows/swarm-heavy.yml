name: Reliability Swarm Container

on:
  push:
    branches: [main, swarm-reliability-gate]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - 'src/**'
      - '.github/workflows/swarm-heavy.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - 'src/**'
      - '.github/workflows/swarm-heavy.yml'
  workflow_dispatch:
  schedule:
    - cron: '13 4 * * 0'

permissions:
  contents: read

concurrency:
  group: container-swarm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container_runtime:
    name: production-container-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config
      - run: docker build -t tiny-decision-stack:swarm .
      - name: Boot and probe image
        run: |
          set -euo pipefail
          docker run -d --name tds-swarm -p 18080:8080 tiny-decision-stack:swarm
          trap 'docker rm -f tds-swarm >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/live >/tmp/live.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/live.json
          test "$(docker exec tds-swarm id -u)" = '10001'
          curl --fail --silent http://127.0.0.1:18080/health/ready | tee /tmp/ready.json
          grep -Eq 'not_ready|ready' /tmp/ready.json
