name: Reliability Swarm

on:
  push:
    branches: [swarm-reliability-gate]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: portable-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: pytest -q
      - run: python -m compileall -q src tests

  fuzz:
    name: fuzz-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      TDS_SWARM_SEED: ${{ matrix.shard }}
      TDS_SWARM_CASES: '400'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_reliability_swarm.py

  dependency_edge:
    name: dependency-${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [floor, current]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - name: Current dependency set
        if: ${{ matrix.profile == 'current' }}
        run: pip install --upgrade -e '.[dev]'
      - name: Declared dependency floors
        if: ${{ matrix.profile == 'floor' }}
        run: |
          pip install -e . --no-deps
          pip install 'fastapi==0.115.0' 'httpx==0.27.0' 'pydantic==2.8.0' 'uvicorn[standard]==0.30.0' 'pytest==8.3.0' 'pytest-asyncio==0.24.0' 'build==1.2.1'
      - run: python -m pip check
      - run: pytest -q
      - run: python -m build

  wheel_install:
    name: clean-wheel-py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Fresh-wheel smoke
        run: |
          python -m venv /tmp/tds-wheel
          /tmp/tds-wheel/bin/python -m pip install --upgrade pip
          /tmp/tds-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/tds-wheel/bin/python -c "from fastapi.testclient import TestClient; from tiny_decision_stack.api import app; c=TestClient(app); assert c.get('/health/live').status_code == 200; print(c.get('/health/ready').json())"
