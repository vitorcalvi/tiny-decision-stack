name: Reliability Swarm

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - swarm-reliability-gate
  schedule:
    - cron: '41 3 * * 0'

permissions:
  contents: read

concurrency:
  group: reliability-swarm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable:
    name: portable ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: pytest -q
      - run: python -m compileall -q src tests
      - run: python -c "import tiny_decision_stack.api, tiny_decision_stack.backends, tiny_decision_stack.orchestrator; print('imports ok')"

  fuzz:
    name: fuzz shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      TDS_SWARM_SEED: ${{ matrix.shard }}
      TDS_SWARM_CASES: '400'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Seeded invariant and concurrency stress
        run: pytest -q tests/test_reliability_swarm.py

  dependency_edge:
    name: dependencies ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [floor, current]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - name: Install current dependency set
        if: matrix.profile == 'current'
        run: pip install --upgrade -e '.[dev]'
      - name: Install declared dependency floors
        if: matrix.profile == 'floor'
        run: |
          pip install -e . --no-deps
          pip install \
            'fastapi==0.115.0' \
            'httpx==0.27.0' \
            'pydantic==2.8.0' \
            'uvicorn[standard]==0.30.0' \
            'pytest==8.3.0' \
            'pytest-asyncio==0.24.0' \
            'build==1.2.1'
      - run: python -m pip check
      - run: pytest -q
      - run: python -m build

  wheel_install:
    name: clean wheel py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install built wheel in a clean venv
        run: |
          python -m venv /tmp/tds-wheel
          /tmp/tds-wheel/bin/python -m pip install --upgrade pip
          /tmp/tds-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/tds-wheel/bin/python - <<'PY'
          from fastapi.testclient import TestClient
          from tiny_decision_stack.api import app
          client = TestClient(app)
          assert client.get('/health/live').status_code == 200
          body = client.get('/health/ready').json()
          assert body['status'] in {'ready', 'not_ready'}
          print(body)
          PY

  container_runtime:
    name: production container runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose
        run: docker compose config
      - name: Build production image
        run: docker build -t tiny-decision-stack:swarm .
      - name: Boot image and validate non-root liveness
        run: |
          set -euo pipefail
          docker run -d --name tds-swarm -p 18080:8080 tiny-decision-stack:swarm
          trap 'docker rm -f tds-swarm >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/live >/tmp/live.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/live.json
          test "$(docker exec tds-swarm id -u)" = '10001'
          curl --fail --silent http://127.0.0.1:18080/health/ready | tee /tmp/ready.json
          grep -Eq 'not_ready|ready' /tmp/ready.json
          test "$(docker inspect --format='{{.State.Health.Status}}' tds-swarm)" != 'unhealthy'

  real_model:
    name: real LFM + OpenDecider CPU
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MODEL_DEVICE: cpu
      HF_HOME: ${{ runner.temp }}/hf-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[local,dev]'
      - run: python -m pip check
      - name: Verify dependency API shape
        run: |
          python - <<'PY'
          import accelerate, torch, transformers, opendecider
          from opendecider import load
          from transformers import AutoModelForCausalLM, AutoTokenizer
          assert callable(load)
          print('accelerate', accelerate.__version__)
          print('torch', torch.__version__)
          print('transformers', transformers.__version__)
          print(AutoModelForCausalLM.__name__, AutoTokenizer.__name__)
          PY
      - name: Exercise real two-model chain repeatedly
        run: |
          python - <<'PY'
          from tiny_decision_stack.backends import LocalLFMBackend, LocalOpenDeciderBackend
          from tiny_decision_stack.models import DecisionRequest
          from tiny_decision_stack.orchestrator import DecisionOrchestrator

          semantic = LocalLFMBackend(device='cpu')
          decider = LocalOpenDeciderBackend(device='cpu')
          assert semantic.status == 'not_loaded'
          assert decider.status == 'not_loaded'
          stack = DecisionOrchestrator(semantic=semantic, decider=decider, direct_max_chars=1)
          cases = [
              (
                  'A customer reports a duplicate card charge. Logs confirm the same order was charged twice.',
                  {'refund': 'Refund a verified duplicate payment', 'escalate': 'Send uncertain cases to human review'},
              ),
              (
                  'The payment is duplicated but authorization metadata is unclear.',
                  {'refund': 'Refund only a verified duplicate', 'review': 'Require human review before action'},
              ),
          ]
          for state, options in cases:
              result = stack.decide(DecisionRequest(
                  state=state,
                  question='What action should the workflow take?',
                  options=options,
                  preprocess='normalize',
                  confidence_threshold=0.0,
                  clarify_on_low_confidence=False,
              ))
              assert result.choice in options
              assert result.mode == 'normalized'
              assert result.normalized_state is not None
              assert set(result.probabilities) == set(options)
              assert abs(sum(result.probabilities.values()) - 1.0) <= 0.02
              print(result.model_dump_json())
          assert semantic.status == 'ready'
          assert decider.status == 'ready'
          PY

  gate:
    name: swarm gate
    if: always()
    needs: [portable, fuzz, dependency_edge, wheel_install, container_runtime, real_model]
    runs-on: ubuntu-latest
    steps:
      - name: Require every swarm to pass
        env:
          PORTABLE: ${{ needs.portable.result }}
          FUZZ: ${{ needs.fuzz.result }}
          DEPENDENCY: ${{ needs.dependency_edge.result }}
          WHEEL: ${{ needs.wheel_install.result }}
          CONTAINER: ${{ needs.container_runtime.result }}
          REAL_MODEL: ${{ needs.real_model.result }}
        run: |
          python - <<'PY'
          import os
          results = {
              'portable': os.environ['PORTABLE'],
              'fuzz': os.environ['FUZZ'],
              'dependency-edge': os.environ['DEPENDENCY'],
              'wheel-install': os.environ['WHEEL'],
              'container-runtime': os.environ['CONTAINER'],
              'real-model': os.environ['REAL_MODEL'],
          }
          print(results)
          bad = {name: result for name, result in results.items() if result != 'success'}
          if bad:
              raise SystemExit(f'swarm gate failed: {bad}')
          print('ALL RELIABILITY SWARMS GREEN')
          PY
