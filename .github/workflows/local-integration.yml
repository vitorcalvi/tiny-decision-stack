# Expensive redundant truth gate: validates real model execution plus production image build.
name: Local dependency integration

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    paths:
      - '.github/workflows/local-integration.yml'

permissions:
  contents: read

jobs:
  imports-models-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[local,dev]'
      - run: python -m pip check
      - name: Verify real dependency APIs
        run: python -c "import accelerate,torch,transformers,opendecider; from opendecider import load; assert callable(load); print(accelerate.__version__, torch.__version__, transformers.__version__)"
      - name: Real two-model CPU smoke
        env:
          MODEL_DEVICE: cpu
        run: python scripts/real_model_smoke.py
      - name: Validate compose
        run: docker compose config
      - name: Build production image
        run: docker build -t tiny-decision-stack:ci .
      - name: Note model-quality boundary
        run: echo 'This proves integration/runtime viability, not domain accuracy or a 95% precision claim.'
